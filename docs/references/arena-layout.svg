<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
<title id="title">Площадь города-улья с космопортом — схема арены RORTYPE</title>
<desc id="desc">Предварительный вид сверху без масштаба: A центральная площадь со статуей, B посадочная площадка на севере, C южная въездная площадь, D западная грузовая зона, E восточная готическая галерея. F внешний сервисный обход соединяет стороны. Показаны укрытия, связи и 12 кандидатных точек появления.</desc>
<defs>
<pattern id="tiles" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0 H0 V36" fill="none" stroke="#435865" stroke-opacity=".09"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#D48D2D" stroke-width="2"/></marker>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#223946}
.title{font-size:36px;font-weight:700}.label{font-size:21px;font-weight:650;text-anchor:middle}
.small{font-size:17px;fill:#516874}.legend{font-size:20px}
.cover{fill:#304A59;stroke:#172B36;stroke-width:2}
.route{fill:none;stroke:#D48D2D;stroke-width:4;stroke-dasharray:11 8;stroke-linecap:round;stroke-linejoin:round}
.spawn{fill:#FFFFFF;stroke:#278C80;stroke-width:2}
.sid{font-size:13px;fill:#166E65;text-anchor:middle;font-weight:650}
</style>
</defs>
<rect width="1440" height="1200" fill="#F5F6F2"/>
<text x="64" y="49" font-size="17" letter-spacing="3" fill="#278C80">RORTYPE · ПРЕДЛОЖЕНИЕ ДЛЯ ГДД</text>
<text x="64" y="98" class="title">Площадь города-улья с космопортом</text>
<text x="64" y="136" class="small">Вид сверху · без масштаба · 3–12 участников · укрытия и два фланга</text>

<!-- The hive and parked shuttle are outside the playable boundary. -->
<path d="M194 218 V190 H222 V168 H244 V190 H272 V218 M740 218 V180 H764 V156 H786 V180 H811 V218" fill="#B4BCB8" stroke="#7D8C8E" stroke-width="2"/>
<rect x="300" y="187" width="430" height="42" rx="5" fill="#D2D4C8" stroke="#A5AEA7" stroke-width="2"/>
<text x="515" y="183" class="small" text-anchor="middle">Терминал и город-улей за границей боя</text>
<path d="M515 191 L537 211 L592 218 L555 226 H475 L438 218 L493 211 Z" fill="#596D76" stroke="#2C4655" stroke-width="2"/>
<rect x="64" y="245" width="920" height="800" rx="25" fill="#DCE3DF" stroke="#516B76" stroke-width="3"/>
<rect x="64" y="245" width="920" height="800" rx="25" fill="url(#tiles)"/>
<path d="M156 302 H893 Q923 302 923 333 V957 Q923 988 893 988 H156 Q125 988 125 957 V333 Q125 302 156 302 Z" class="route"/>
<text x="678" y="282" class="small" text-anchor="middle">F · Внешний обход</text>

<!-- Northern spaceport. -->
<path d="M464 332 H584 L618 365 V477 L584 510 H464 L430 477 V365 Z" fill="#ACBEC2" stroke="#647D88" stroke-width="3"/>
<circle cx="524" cy="421" r="62" fill="none" stroke="#D9D9BF" stroke-width="6"/>
<path d="M493 421 H555 M524 390 V452" fill="none" stroke="#6C858E" stroke-width="8"/>
<text x="524" y="365" class="label">B · Космопорт</text>
<text x="524" y="489" class="small" text-anchor="middle">Посадочная площадка</text>
<rect x="451" y="538" width="59" height="20" rx="4" class="cover"/>
<rect x="538" y="538" width="59" height="20" rx="4" class="cover"/>
<path d="M408 477 V584 M640 477 V584" class="route" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Central plaza and civic monument. -->
<rect x="357" y="585" width="334" height="216" rx="31" fill="#ECEBDC" stroke="#9FABAA" stroke-width="2"/>
<circle cx="524" cy="693" r="98" fill="none" stroke="#B8C3BF" stroke-width="2"/>
<text x="524" y="615" class="label">A · Центральная площадь</text>
<rect x="485" y="656" width="78" height="82" rx="8" class="cover"/>
<path d="M524 666 L546 695 L524 725 L502 695 Z" fill="#D4C6A3" stroke="#FAF6E6" stroke-width="2"/>
<text x="524" y="777" class="small" text-anchor="middle">Статуя на массивном основании</text>
<rect x="382" y="651" width="25" height="41" rx="4" class="cover"/>
<rect x="641" y="707" width="25" height="41" rx="4" class="cover"/>
<path d="M524 561 V639 M524 754 V861 M324 694 H459 M589 694 H725" class="route" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Cargo flank. -->
<rect x="183" y="473" width="149" height="376" rx="18" fill="#C5D4CA" stroke="#85A196" stroke-width="2"/>
<text x="258" y="515" class="label">D · Грузы</text>
<rect x="205" y="545" width="61" height="38" rx="5" fill="#B9685B" stroke="#754C45" stroke-width="2"/>
<path d="M213 552 H258 M213 576 H258" stroke="#D8B1A0" stroke-width="2"/>
<circle cx="301" cy="628" r="18" class="cover"/>
<circle cx="226" cy="760" r="21" class="cover"/>
<rect x="268" y="795" width="41" height="28" rx="4" fill="#B9685B" stroke="#754C45" stroke-width="2"/>
<path d="M283 464 V490 M270 594 V695 M286 712 V781" class="route"/>
<path d="M332 566 L402 507 M332 815 L407 877" class="route" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Gothic gallery flank. -->
<rect x="716" y="473" width="149" height="376" rx="18" fill="#DDD7BF" stroke="#B4A887" stroke-width="2"/>
<text x="790" y="515" class="label">E · Галерея</text>
<path d="M735 546 V531 Q748 515 761 531 V546 M804 546 V531 Q817 515 830 531 V546" fill="none" stroke="#9C947B" stroke-width="5"/>
<rect x="745" y="586" width="27" height="32" rx="4" class="cover"/>
<rect x="809" y="737" width="27" height="32" rx="4" class="cover"/>
<rect x="746" y="797" width="55" height="22" rx="4" class="cover"/>
<path d="M790 554 V680 M790 711 V785" class="route"/>
<path d="M716 566 L646 507 M716 815 L642 877" class="route" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- South civic gate. -->
<rect x="357" y="863" width="334" height="105" rx="18" fill="#D2DCD9" stroke="#8A9F9F" stroke-width="2"/>
<text x="524" y="942" class="label">C · Въездная площадь</text>
<rect x="388" y="884" width="66" height="24" rx="4" class="cover"/>
<rect x="594" y="884" width="66" height="24" rx="4" class="cover"/>
<path d="M400 968 V990 M648 968 V990" class="route" marker-end="url(#arrow)"/>
<path d="M125 694 V655 H182 M865 694 H923 M257 302 V458 M790 302 V458" class="route" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M457 1031 V1014 Q475 991 493 1014 V1031 M555 1031 V1014 Q573 991 591 1014 V1031" fill="none" stroke="#7D8882" stroke-width="8"/>

<!-- Candidate spawn points with screening blocks, never guaranteed safe. -->
<rect x="195" y="328" width="60" height="20" rx="4" class="cover"/>
<rect x="741" y="347" width="45" height="20" rx="4" class="cover"/>
<rect x="856" y="416" width="19" height="52" rx="4" class="cover"/>
<rect x="879" y="576" width="19" height="52" rx="4" class="cover"/>
<rect x="879" y="786" width="19" height="52" rx="4" class="cover"/>
<rect x="175" y="949" width="60" height="20" rx="4" class="cover"/>
<rect x="793" y="949" width="60" height="20" rx="4" class="cover"/>
<rect x="150" y="419" width="19" height="52" rx="4" class="cover"/>
<rect x="150" y="576" width="19" height="52" rx="4" class="cover"/>
<rect x="150" y="786" width="19" height="52" rx="4" class="cover"/>
<circle cx="222" cy="269" r="18" class="spawn"/><text x="222" y="273.5" class="sid">S1</text>
<circle cx="524" cy="269" r="18" class="spawn"/><text x="524" y="273.5" class="sid">S2</text>
<circle cx="821" cy="269" r="18" class="spawn"/><text x="821" y="273.5" class="sid">S3</text>
<circle cx="958" cy="445" r="18" class="spawn"/><text x="958" y="449.5" class="sid">S4</text>
<circle cx="958" cy="603" r="18" class="spawn"/><text x="958" y="607.5" class="sid">S5</text>
<circle cx="958" cy="813" r="18" class="spawn"/><text x="958" y="817.5" class="sid">S6</text>
<circle cx="821" cy="1018" r="18" class="spawn"/><text x="821" y="1022.5" class="sid">S7</text>
<circle cx="524" cy="1018" r="18" class="spawn"/><text x="524" y="1022.5" class="sid">S8</text>
<circle cx="222" cy="1018" r="18" class="spawn"/><text x="222" y="1022.5" class="sid">S9</text>
<circle cx="90" cy="813" r="18" class="spawn"/><text x="90" y="817.5" class="sid">S10</text>
<circle cx="90" cy="603" r="18" class="spawn"/><text x="90" y="607.5" class="sid">S11</text>
<circle cx="90" cy="445" r="18" class="spawn"/><text x="90" y="449.5" class="sid">S12</text>

<path d="M1008 250 H1375" stroke="#B6C2C3"/>
<text x="1030" y="294" font-size="25" font-weight="700">Ориентиры и маршруты</text>
<text x="1030" y="336" class="legend"><tspan x="1030">A · Бой вокруг статуи</tspan><tspan x="1030" dy="34">B · Космопорт / открытый пад</tspan><tspan x="1030" dy="34">C · Ворота города</tspan><tspan x="1030" dy="34">D · Грузовой фланг</tspan><tspan x="1030" dy="34">E · Готическая галерея</tspan><tspan x="1030" dy="34">F · Сервисный обход</tspan></text>
<path d="M1030 550 H1375" stroke="#B6C2C3"/>
<rect x="1030" y="582" width="43" height="25" rx="4" class="cover"/><text x="1090" y="601" class="legend">Укрытие / опора</text>
<path d="M1030 644 H1073" class="route"/><text x="1090" y="651" class="legend">Связь зон</text>
<circle cx="1051" cy="692" r="18" class="spawn"/><text x="1051" y="697" class="sid">S</text><text x="1090" y="699" class="legend">Кандидат появления</text>
<text x="1030" y="771" font-size="24" font-weight="650">Предложение по бою</text>
<text x="1030" y="811" class="legend"><tspan x="1030">Четыре подхода к центру.</tspan><tspan x="1030" dy="31">Два входа с космопорта.</tspan><tspan x="1030" dy="31">Два разных боковых пути.</tspan><tspan x="1030" dy="31">Укрытия дробят линии огня.</tspan><tspan x="1030" dy="31">Один связанный внешний круг.</tspan></text>
<text x="1030" y="1006" class="small"><tspan x="1030">Высотные здания, шаттл и краны</tspan><tspan x="1030" dy="25">остаются за границей боя.</tspan></text>
<text x="64" y="1091" font-size="21" font-weight="650">Мокрый сланец · костяная готика · красные грузы · янтарный свет</text>
<text x="64" y="1132" class="small">Размеры и S1–S12 предварительные. Безопасность появления и удобство для 3/12 участников ещё не проверены.</text>
<text x="64" y="1164" class="small">Схема задаёт предложение по пространству; иллюстрация арены передаёт атмосферу. Unity-сцена по ней ещё не построена.</text>
</svg>